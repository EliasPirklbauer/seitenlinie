<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1411">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seitenlinie">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<title>Seitenlinie – Fußball Manager</title>
<style>
:root{
  --bg:#0d1411;--panel:#141f1a;--panel2:#1b2a23;--line:#263a30;--text:#e6eee8;--muted:#8fa398;
  --accent:#38d47c;--accent-d:#1f8f50;--gold:#f0bf4c;--bad:#ef5d5d;--blue:#5aa9f0;
  --r:10px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
select{padding-right:6px}
h1,h2,h3{margin:0 0 10px;line-height:1.2}
h2{font-size:19px}h3{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--muted)}.small{font-size:12.5px}.good{color:var(--accent)}.bad{color:var(--bad)}.gold{color:var(--gold)}
.btn{white-space:nowrap;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent-d)}
.btn.pri{background:var(--accent);color:#06200f;border-color:var(--accent);font-weight:700}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{border-color:#6b2b2b;color:#ffb3b3}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12px;white-space:nowrap}
.badge{display:inline-flex;width:26px;height:26px;border-radius:7px;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex:none;border:2px solid}
/* Layout */
.shell{min-height:100vh;display:grid;grid-template-columns:210px 1fr;grid-template-rows:auto 1fr}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + var(--sat));padding-left:calc(16px + var(--sal));padding-right:calc(16px + var(--sar));background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .club{display:flex;align-items:center;gap:10px;min-width:0}
.top .club b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .meta{display:flex;gap:14px;margin-left:auto;align-items:center}
.side{background:var(--panel);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;color:var(--text);text-decoration:none;cursor:pointer;user-select:none}
.nav a:hover{background:var(--panel2)}
.nav a.on{background:var(--panel2);color:var(--accent);font-weight:600}
.main{padding:18px;padding-left:calc(18px + var(--sal));padding-right:calc(18px + var(--sar));min-width:0;max-width:1300px;width:100%}
.bnav{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:12px;padding-bottom:calc(84px + var(--sab))}
  .top .meta .hide-m{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;z-index:30;padding-bottom:var(--sab);scrollbar-width:none}
  .bnav a{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;padding:7px 4px;font-size:11px;color:var(--muted);text-decoration:none;cursor:pointer}
  .bnav a span{font-size:19px;line-height:1.2}
  .bnav a.on{color:var(--accent)}
}
/* Tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;background:var(--panel)}
th,td{padding:7px 9px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--panel2);position:sticky;top:0}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
tr.me td{background:rgba(56,212,124,.10)}
tr.z-cl td:first-child{box-shadow:inset 3px 0 var(--accent)}
tr.z-el td:first-child{box-shadow:inset 3px 0 var(--blue)}
tr.z-rel td:first-child{box-shadow:inset 3px 0 var(--gold)}
tr.z-ab td:first-child{box-shadow:inset 3px 0 var(--bad)}
.ovr{display:inline-block;min-width:30px;text-align:center;border-radius:6px;padding:1px 5px;font-weight:700;font-size:13px}
/* Bars */
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.attr{display:grid;grid-template-columns:90px 1fr 30px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
/* Pitch */
.pitch{position:relative;width:100%;max-width:440px;aspect-ratio:68/100;margin:auto;border-radius:12px;background:
 repeating-linear-gradient(0deg,#1d5a37 0 10%,#1a5232 10% 20%);border:2px solid #2f7a4d;overflow:hidden}
.pitch:before{content:"";position:absolute;left:20%;right:20%;top:0;height:15%;border:2px solid rgba(255,255,255,.35);border-top:0}
.pitch:after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:15%;border:2px solid rgba(255,255,255,.35);border-bottom:0}
.pitch .mid{position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.35)}
.pitch .circ{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.35);border-radius:50%}
.slot{position:absolute;transform:translate(-50%,-50%);text-align:center;width:78px;cursor:pointer}
.slot .dot{width:34px;height:34px;margin:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.slot .nm{font-size:11px;background:rgba(0,0,0,.55);border-radius:5px;padding:1px 4px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.sel .dot{outline:3px solid var(--gold)}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:640px;width:100%;max-height:calc(100vh - 28px);overflow:auto;padding:18px}
/* Live */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.score .big{font-size:44px;font-weight:800;letter-spacing:2px}
.tick{max-height:52vh;overflow:auto}
.ev{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px}
.ev.goal{background:rgba(56,212,124,.10);font-weight:600}
.ev .m{color:var(--muted);text-align:right}
.news{border-left:3px solid var(--line);padding:6px 10px;margin:6px 0;background:var(--panel2);border-radius:0 8px 8px 0}
.news.t-offer{border-left-color:var(--gold)}.news.t-board{border-left-color:var(--blue)}.news.t-transfer{border-left-color:var(--accent)}.news.t-coach{border-left-color:var(--bad)}
.clubpick{cursor:pointer;transition:border-color .15s}
.clubpick:hover,.clubpick.on{border-color:var(--accent)}
.title{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;padding-top:calc(20px + var(--sat));background:radial-gradient(circle at 50% 0%,#1d3a2a,var(--bg) 70%)}
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--sab));white-space:nowrap;z-index:55;background:var(--panel2);border:1px solid var(--gold);border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4);font-size:14px;max-width:calc(100% - 20px)}
.setup-grid{display:grid;grid-template-columns:330px 1fr;gap:14px;align-items:start}
.assoc-list{max-height:62vh;overflow:auto;gap:8px;padding-right:4px}
@media (max-width:900px){.setup-grid{grid-template-columns:1fr}.assoc-list{max-height:34vh}}
optgroup{color:#000}
@media (max-width:900px){#cupgrid{grid-template-columns:1fr!important}}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent-d);padding:10px 16px;border-radius:10px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel2);border:0;padding:7px 12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#06200f;font-weight:700}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
</style>
</head>
<body>
<div id="app"></div>
<noscript>Seitenlinie benötigt JavaScript.</noscript>
<script src="world.js"></script>
<script src="engine.js"></script>
<script src="comps.js"></script>
<script src="natcups.js"></script>
<script src="ui.js"></script>
</body>
</html>
