<title>Seitenlinie – Fußball Manager</title>
<style>
/* ===== Seitenlinie · Design „Flutlichtabend“ ===== */
@font-face{font-family:'Rubik';src:url('fonts/Rubik-var.woff') format('woff');font-weight:300 900;font-display:swap}
@font-face{font-family:'Barlow Condensed';src:url('fonts/BarlowCondensed-600.woff') format('woff');font-weight:600;font-display:swap}
@font-face{font-family:'Barlow Condensed';src:url('fonts/BarlowCondensed-700.woff') format('woff');font-weight:700 800;font-display:swap}
:root{
  --night:#131b2e;--night2:#172036;--panel:#1c2740;--panel2:#243150;--panel3:#2b3a5e;--line:#2f3d5e;--line2:#3a4a70;
  --text:#eef2fa;--muted:#9ba8c4;--dim:#6f7d9c;
  --accent:#ffc65c;--accent-ink:#2b1e00;--accent-soft:rgba(255,198,92,.14);
  --good:#5ed6a0;--bad:#ff7d6e;--info:#82b6ff;--gold:#ffc65c;--blue:#82b6ff;
  --r:18px;--r2:12px;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -12px rgba(5,10,25,.7);
  --display:'Barlow Condensed','Rubik',system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--text);font:15px/1.5 'Rubik',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{background:
  radial-gradient(1100px 520px at 12% -12%,rgba(255,198,92,.10),transparent 60%),
  radial-gradient(900px 480px at 100% -10%,rgba(130,182,255,.08),transparent 60%),var(--night);background-attachment:fixed;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
input,select,textarea{font:inherit;color:var(--text);background:var(--night2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;padding:0;vertical-align:-3px}
h1,h2,h3{margin:0 0 10px;line-height:1.2;font-weight:700}
h1{font-family:var(--display);letter-spacing:.005em}
h2{font-family:var(--display);font-size:27px;letter-spacing:.01em;font-weight:700}
h3{font-family:var(--display);font-size:17px;color:var(--muted);font-weight:600;letter-spacing:.02em}
h2 .small,h2 .muted,h3 .small,h3 .muted{font-family:'Rubik',sans-serif;font-weight:400;letter-spacing:0}
a{color:inherit}
.muted{color:var(--muted)}.small{font-size:13px}.good{color:var(--good)}.bad{color:var(--bad)}.gold{color:var(--accent)}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:9px 16px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--panel3)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 6px 18px -8px rgba(255,198,92,.7)}
.btn.pri:hover{background:#ffd27c}
.btn.warn{border-color:rgba(255,125,110,.45);color:#ffb3aa;background:transparent}
.btn.sm{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 40%),var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.card .card{box-shadow:none;border-radius:var(--r2);background:var(--night2)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);font-size:12px;white-space:nowrap;font-weight:600}
.pill.good{color:var(--good);border-color:rgba(94,214,160,.35);background:rgba(94,214,160,.08)}
/* Vereinswappen als kleines Schild */
.badge{display:inline-flex;width:26px;height:28px;border-radius:7px 7px 13px 13px;align-items:center;justify-content:center;font-family:var(--display);font-size:11px;font-weight:700;flex:none;border:2px solid;letter-spacing:.03em;vertical-align:middle;box-shadow:0 2px 6px rgba(0,0,0,.25)}
/* ===== Layout ===== */
.shell{min-height:100vh;display:grid;grid-template-columns:232px 1fr;grid-template-rows:auto 1fr}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:12px 20px;padding-top:calc(12px + var(--sat));padding-left:calc(20px + var(--sal));padding-right:calc(20px + var(--sar));
  background:rgba(19,27,46,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .brand{font-family:var(--display);font-size:24px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;min-width:200px}
.top .brand i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px 3px rgba(255,198,92,.55)}
.top .club{display:flex;align-items:center;gap:11px;min-width:0}
.top .club b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.top .meta{display:flex;gap:16px;margin-left:auto;align-items:center}
.top .meta .stat{display:flex;flex-direction:column;line-height:1.15;text-align:right}
.top .meta .stat span{font-size:11px;color:var(--muted)}
.top .meta .stat b{font-family:var(--display);font-size:21px;letter-spacing:.02em}
.side{padding:14px 12px;position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto;border-right:1px solid var(--line);background:rgba(23,32,54,.5)}
.nav a{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:12px;color:var(--muted);text-decoration:none;cursor:pointer;user-select:none;font-weight:600;font-size:14px;margin-bottom:2px;position:relative;transition:background .15s,color .15s}
.nav a svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--panel);color:var(--text)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav a.on:before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.main{padding:22px 26px;padding-left:calc(26px + var(--sal));padding-right:calc(26px + var(--sar));min-width:0;max-width:1320px;width:100%}
.bnav{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side,.top .brand{display:none}
  .main{padding:14px;padding-bottom:calc(96px + var(--sab))}
  .top{padding:10px 14px;padding-top:calc(10px + var(--sat))}
  .top .meta .hide-m{display:none}
  .bnav{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + var(--sab));background:rgba(28,39,64,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:22px;overflow-x:auto;z-index:30;scrollbar-width:none;box-shadow:0 12px 30px -10px rgba(0,0,0,.6)}
  .bnav::-webkit-scrollbar{display:none}
  .bnav a{flex:1 0 66px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;font-size:10.5px;font-weight:600;color:var(--muted);text-decoration:none;cursor:pointer}
  .bnav a svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bnav a.on{color:var(--accent)}
}
/* ===== Tabellen ===== */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r2);border:1px solid var(--line);background:var(--panel)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid rgba(47,61,94,.6)}
tbody tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--night2);position:sticky;top:0;z-index:1}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(255,255,255,.035)}
tr.me td{background:rgba(130,182,255,.13)}
tr.z-cl td:first-child{box-shadow:inset 3px 0 var(--good)}
tr.z-el td:first-child{box-shadow:inset 3px 0 var(--info)}
tr.z-rel td:first-child{box-shadow:inset 3px 0 var(--accent)}
tr.z-ab td:first-child{box-shadow:inset 3px 0 var(--bad)}
.ovr{display:inline-block;min-width:34px;text-align:center;border-radius:8px;padding:1px 6px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.02em}
/* ===== Balken & Werte ===== */
.bar{height:8px;background:var(--night2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--good),#9be6c3);border-radius:99px}
.attr{display:grid;grid-template-columns:96px 1fr 30px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
/* ===== Spielfeld ===== */
.pitch{position:relative;width:100%;max-width:440px;aspect-ratio:68/100;margin:auto;border-radius:20px;overflow:hidden;
  background:radial-gradient(120% 70% at 50% -10%,rgba(255,240,200,.18),transparent 55%),repeating-linear-gradient(0deg,#1f6b45 0 10%,#1b603e 10% 20%);border:1px solid #2f8257;box-shadow:inset 0 0 60px rgba(0,0,0,.35),var(--shadow)}
.pitch:before{content:"";position:absolute;left:20%;right:20%;top:0;height:15%;border:2px solid rgba(255,255,255,.4);border-top:0;border-radius:0 0 4px 4px}
.pitch:after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:15%;border:2px solid rgba(255,255,255,.4);border-bottom:0;border-radius:4px 4px 0 0}
.pitch .mid{position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.4)}
.pitch .circ{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.4);border-radius:50%}
.slot{position:absolute;transform:translate(-50%,-50%);text-align:center;width:80px;cursor:pointer}
.slot .dot{width:36px;height:36px;margin:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:16px;border:2px solid rgba(255,255,255,.9);box-shadow:0 4px 10px rgba(0,0,0,.4);transition:transform .15s}
.slot:hover .dot{transform:scale(1.08)}
.slot .nm{font-size:11px;font-weight:600;background:rgba(10,20,35,.7);border-radius:7px;padding:1px 6px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.sel .dot{outline:3px solid var(--accent);outline-offset:2px}
/* ===== Dialoge ===== */
.ov{position:fixed;inset:0;background:rgba(8,12,24,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;animation:fade .15s ease-out}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:22px;max-width:660px;width:100%;max-height:calc(100vh - 28px);overflow:auto;padding:20px 22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7);animation:pop .18s ease-out}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
/* ===== Anzeigetafel (Live) ===== */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center}
.score .big{font-family:var(--display);font-size:72px;letter-spacing:.03em;line-height:.95}
.tick{max-height:54vh;overflow:auto}
.ev{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:8px 6px;border-bottom:1px solid rgba(47,61,94,.6);font-size:14px}
.ev.goal{background:rgba(94,214,160,.08);border-radius:10px;font-weight:600}
.ev .m{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
/* ===== Posteingang ===== */
.news{border-left:3px solid var(--line2);padding:9px 13px;margin:8px 0;background:var(--night2);border-radius:4px 12px 12px 4px}
.news.t-press{border-left-color:#7a5cc7}.news.t-fans{border-left-color:#d4572a}.news.t-offer{border-left-color:var(--accent)}.news.t-board{border-left-color:var(--info)}.news.t-transfer{border-left-color:var(--good)}.news.t-coach{border-left-color:var(--bad)}
.clubpick{cursor:pointer;transition:border-color .15s,background .15s}
.clubpick:hover{border-color:var(--line2);background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 40%),var(--panel)}
.clubpick.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,var(--shadow)}
/* ===== Startseite ===== */
.title{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;padding-top:calc(20px + var(--sat));
  background:radial-gradient(520px 340px at 28% -8%,rgba(255,198,92,.20),transparent 70%),radial-gradient(520px 340px at 72% -8%,rgba(255,198,92,.16),transparent 70%),radial-gradient(1200px 520px at 50% 125%,rgba(46,140,92,.38),transparent 62%)}
.title .card{background:rgba(28,39,64,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.wordmark{font-family:var(--display);font-size:62px;letter-spacing:.02em;margin:4px 0 0;line-height:.95}
.chalk{height:4px;width:64%;margin:14px auto 12px;border-radius:4px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.85) 0 22px,transparent 22px 30px)}
.toast{position:fixed;left:50%;bottom:calc(104px + var(--sab));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);padding:11px 18px;border-radius:999px;z-index:60;box-shadow:0 12px 30px -10px rgba(0,0,0,.6);font-weight:600;font-size:14px;animation:pop .18s ease-out}
@media (min-width:901px){.toast{bottom:28px}}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;background:var(--night2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{background:transparent;border:0;padding:7px 12px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel3);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
label.f{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + var(--sab));white-space:nowrap;z-index:55;background:var(--panel2);border:1px solid var(--accent);border-radius:999px;padding:7px 8px 7px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 30px -10px rgba(0,0,0,.6);font-size:14px;max-width:calc(100% - 20px)}
@media (min-width:901px){.upd{bottom:28px}}
.setup-grid{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.assoc-list{max-height:62vh;overflow:auto;gap:8px;padding-right:4px}
@media (max-width:900px){.setup-grid{grid-template-columns:1fr}.assoc-list{max-height:34vh}#cupgrid{grid-template-columns:1fr!important}}
optgroup{color:#000}
/* Nächstes Spiel: Flutlicht-Karte */
.matchcard{position:relative;overflow:hidden;background:radial-gradient(420px 200px at 50% -40px,rgba(255,214,140,.20),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.03),transparent 40%),var(--panel)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center;margin:6px 0 10px}
.vs .team b{display:block;margin-top:8px;font-size:15px}
.vs .team .small{display:block}
.vs .mid{font-family:var(--display);font-size:34px;color:var(--muted)}
.vs .mid small{display:block;font-family:'Rubik',sans-serif;font-size:12px;margin-top:2px}
.vs .team b{font-family:var(--display);font-size:21px;letter-spacing:.02em;font-weight:700}
.home-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
@media (max-width:900px){.home-grid{grid-template-columns:1fr}}
.pill.wrap{white-space:normal;text-align:center}
.lamps{display:flex;justify-content:center;gap:7px;margin-bottom:16px}
.lamps i{width:9px;height:9px;border-radius:50%;background:#ffe2a6;box-shadow:0 0 12px 3px rgba(255,198,92,.55)}
.sticky-cta{position:sticky;bottom:0;padding:16px 0;padding-bottom:calc(16px + var(--sab));background:linear-gradient(transparent,var(--night) 45%)}
.phead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.pscore{display:flex;gap:12px}
.pscore>div{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--night2);border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.pscore span{font-size:11px;color:var(--muted)}
.pscore .ovr{font-size:24px;min-width:44px}
.attrgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
@media (max-width:640px){.attrgrid{grid-template-columns:1fr 1fr}.attrgrid .acol:last-child{grid-column:1/-1}}
.acol{background:var(--night2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.acol h3{margin:0 0 6px}
.arow{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;padding:2.5px 0;color:var(--muted)}
.arow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:640px){.arow{font-size:12px}.acol{padding:8px 9px}}
.arow.key{color:var(--text);font-weight:600}
.arow.key span:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:2px}
.av{font-family:var(--display);font-size:16px;min-width:26px;text-align:center;border-radius:6px;padding:0 4px}
.av.v1{color:#ff8f82}.av.v2{color:var(--text)}.av.v3{color:var(--good)}.av.v4{color:var(--night);background:var(--accent)}
.keymark{color:var(--text)}
.minipitch{position:relative;aspect-ratio:68/80;max-width:240px;border-radius:14px;background:repeating-linear-gradient(0deg,#1f6b45 0 12.5%,#1b603e 12.5% 25%);border:1px solid #2f8257}
.pdot{position:absolute;transform:translate(-50%,-50%);min-width:38px;padding:2px 5px;border-radius:9px;text-align:center;font-size:10px;font-weight:700;line-height:1.1;border:1px solid rgba(255,255,255,.25)}
.pdot small{display:block;font-family:var(--display);font-size:13px}
.pdot.f4{background:var(--good);color:#06281a}.pdot.f3{background:#a9e8c8;color:#0b2d1e}.pdot.f2{background:#ffd88a;color:#3a2700}.pdot.f1{background:rgba(255,143,130,.85);color:#2d0a06}.pdot.f0{background:rgba(10,20,35,.55);color:var(--dim)}
.kpi{font-family:var(--display);font-size:42px;line-height:1;letter-spacing:.02em}
.modal:has(.pcard){max-width:900px}
.pid{display:flex;gap:14px;align-items:center;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.ptabs{margin:16px 0 4px;width:100%;display:flex}.ptabs button{flex:1;font-size:14.5px;padding:9px 12px}
.pbody{margin-top:12px}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ptile{background:var(--night2);border:1px solid var(--line);border-radius:14px;padding:10px 13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ptile>span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ===================================================================
   Design „Trainerbüro“ – heller Schreibtisch mit Unterlagen
   =================================================================== */
@font-face{font-family:'Caveat';src:url('fonts/Caveat-700.woff') format('woff');font-weight:400 900;font-display:swap}
html.desk{
  --night:#efe6d6;--night2:#f7f2e8;--panel:#fffdf8;--panel2:#f4eee2;--panel3:#e9e0cd;--line:#e6dccb;--line2:#d3c5aa;
  --text:#1f2735;--muted:#6c6556;--dim:#9b927f;
  --accent:#b0650a;--accent-ink:#2a2000;--accent-soft:rgba(255,210,63,.38);
  --good:#1e8a58;--bad:#c63d2b;--info:#2a68b8;--gold:#b0650a;--blue:#2a68b8;
  --ink:#24406e;--marker:#ffd23f;--red:#d2402c;--kraft:#ead8b0;
  --r:8px;--r2:6px;
  --hand:'Caveat','Barlow Condensed',cursive;
  --shadow:0 1px 1px rgba(90,65,30,.08),0 10px 22px -14px rgba(90,65,30,.45);
  color-scheme:light;
}
html.desk,html.desk body{background-color:var(--night)}
html.desk body{background:
  radial-gradient(1200px 600px at 15% -10%,rgba(255,255,255,.75),transparent 60%),
  radial-gradient(900px 500px at 100% 110%,rgba(196,160,110,.18),transparent 60%),
  repeating-linear-gradient(91deg,rgba(150,110,60,.035) 0 2px,transparent 2px 11px),
  repeating-linear-gradient(89.3deg,rgba(150,110,60,.03) 0 1px,transparent 1px 37px),
  linear-gradient(180deg,#f3ebdc,#ebdfc9);background-attachment:fixed}
/* Überschriften wie mit dem Filzstift geschrieben */
html.desk h2{font-family:var(--hand);font-size:36px;font-weight:700;letter-spacing:0;color:var(--ink);line-height:1.05}
html.desk h2 .small,html.desk h2 .muted{font-family:'Rubik',sans-serif}
html.desk h3{color:var(--ink);text-transform:uppercase;font-size:14.5px;letter-spacing:.09em;font-weight:700}
html.desk .main>h2:first-child,html.desk .main>.row:first-child h2{position:relative;display:inline-block;padding:0 6px}
html.desk .main>h2:first-child:after{content:"";position:absolute;left:0;right:-8px;bottom:5px;height:11px;background:var(--marker);opacity:.55;z-index:-1;border-radius:3px;transform:rotate(-.6deg)}
html.desk .main{position:relative;z-index:0}
/* Karten = Blätter Papier auf dem Tisch */
html.desk .card{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r)}
html.desk .card .card{background:var(--night2);box-shadow:none}
html.desk .main>.grid>.card:nth-child(3n+1){transform:rotate(-.15deg)}
html.desk .main>.grid>.card:nth-child(3n+2){transform:rotate(.12deg)}
html.desk .card>h3:first-child{padding-bottom:7px;margin-bottom:12px;border-bottom:2px solid var(--ink);border-bottom-style:double;border-bottom-width:3px;border-color:rgba(36,64,110,.25)}
/* Büroklammer auf den Hauptkarten der Startseite */
html.desk .home-grid>.card{position:relative}
html.desk .home-grid>.card:before{content:"";position:absolute;top:-9px;right:26px;width:14px;height:34px;border:2.5px solid #9aa3ad;border-radius:8px;border-bottom-color:#8a939c;background:transparent;box-shadow:inset 0 0 0 2px transparent;transform:rotate(8deg)}
html.desk .home-grid>.card:after{content:"";position:absolute;top:-2px;right:30px;width:6px;height:20px;border:2.5px solid #9aa3ad;border-top:0;border-radius:0 0 5px 5px;transform:rotate(8deg)}
/* Spieltagskarte wie ein Spielbericht mit Klebestreifen */
html.desk .matchcard{background:var(--panel);overflow:visible}
html.desk .matchcard:before,html.desk .matchcard:after{display:none}
html.desk .matchcard>h3:first-child:before{content:"";position:absolute;top:-11px;left:50%;width:110px;height:24px;margin-left:-55px;background:rgba(255,236,170,.75);border-left:1px dashed rgba(160,130,60,.35);border-right:1px dashed rgba(160,130,60,.35);transform:rotate(-2deg);box-shadow:0 1px 2px rgba(0,0,0,.06)}
html.desk .lamps i{background:var(--red);box-shadow:0 1px 2px rgba(0,0,0,.3)}
html.desk .vs .mid{font-family:var(--hand);font-size:40px;color:var(--red)}
html.desk .nxwhen b{font-family:var(--hand);font-size:28px;color:var(--ink);font-weight:700}
html.desk .nxwhen span{color:var(--red)}
/* Kopfleiste & Navigation (Register eines Ordners) */
html.desk .top{background:rgba(255,253,248,.92);border-bottom:1px solid var(--line2);box-shadow:0 2px 10px -6px rgba(90,65,30,.35)}
html.desk .top .brand{font-family:var(--hand);font-size:34px;color:var(--ink)}
html.desk .top .brand i{background:var(--red);box-shadow:none;width:11px;height:11px}
html.desk .top .meta .stat b{color:var(--ink)}
html.desk .side{background:linear-gradient(90deg,#e7d3a6,var(--kraft));border-right:1px solid #cdb17a;box-shadow:inset -8px 0 14px -10px rgba(90,60,20,.35)}
html.desk .nav a{color:#5a4a2c;border-radius:4px 10px 10px 4px}
html.desk .nav a:hover{background:rgba(255,253,248,.55);color:var(--text)}
html.desk .nav a.on{background:var(--panel);color:var(--ink);box-shadow:0 2px 6px -2px rgba(90,60,20,.35);margin-right:-13px;border-radius:4px 0 0 4px}
html.desk .nav a.on:before{left:-12px;background:var(--red);width:4px}
html.desk .bnav{background:rgba(255,253,248,.95);border-color:var(--line2);box-shadow:0 10px 26px -10px rgba(90,65,30,.5)}
html.desk .bnav a{color:var(--muted)}html.desk .bnav a.on{color:var(--ink)}
html.desk .bnav a.on svg{stroke:var(--red)}
/* Schaltflächen */
html.desk .btn{background:var(--panel);border-color:var(--line2);color:var(--text);box-shadow:0 1px 0 rgba(90,65,30,.08)}
html.desk .btn:hover{background:var(--panel2)}
html.desk .btn.pri{background:var(--marker);border-color:#e9b81c;color:#2a2000;box-shadow:0 4px 12px -6px rgba(190,140,0,.8)}
html.desk .btn.pri:hover{background:#ffdb5e}
html.desk .btn.warn{border-color:rgba(198,61,43,.5);color:var(--bad);background:transparent}
html.desk .pill{background:var(--panel2);border-color:var(--line2)}
html.desk .pill.good{background:rgba(30,138,88,.09);border-color:rgba(30,138,88,.35)}
html.desk .seg{background:var(--panel2);border-color:var(--line)}
html.desk .seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(90,65,30,.25)}
html.desk input,html.desk select,html.desk textarea{background:#fff;border-color:var(--line2);color:var(--text)}
html.desk .dinp input{color-scheme:light}
html.desk optgroup{color:var(--text)}
/* Tabellen wie liniertes Papier, eigene Zeile mit Textmarker */
html.desk .tw{background:var(--panel);border-color:var(--line)}
html.desk th{background:#f5efe3;color:var(--ink);text-transform:uppercase;font-size:11px;letter-spacing:.07em;border-bottom:2px solid rgba(36,64,110,.22)}
html.desk th,html.desk td{border-bottom-color:#e9e1d1}
html.desk tr.click:hover td{background:rgba(42,104,184,.05)}
html.desk tr.me td{background:rgba(255,210,63,.33)}

.vrsys{align-self:center;font-size:12px;color:var(--muted);text-align:center;padding:2px 10px;border-radius:999px;background:var(--panel2)}
.vrpanel{padding:14px 16px}
.vrmeter{display:grid;grid-template-columns:1fr 2fr 30px;gap:8px;align-items:center;font-size:12.5px;margin-bottom:6px}.vrmeter .cbar{margin:0}
.vrargs{display:flex;flex-wrap:wrap;gap:6px}.vrargs.col{flex-direction:column}
.vrargs button{background:var(--night2);border:1px solid var(--line2);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--text);text-align:left}
.vrargs button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--night2))}.vrargs button.used{opacity:.5}.vrargs button:disabled{opacity:.35}
.vrg{font-style:italic;color:var(--muted)}
.planrow{gap:6px;margin-top:6px;flex-wrap:nowrap}.planrow .minp input{width:110px}
.vrpanel.busy{opacity:.55;pointer-events:none}
.vrpanel .btn{white-space:normal;text-align:left}
.vrmsg.typing>div{padding:6px 12px}

/* ===== Mitarbeiter ===== */
.crewgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.crewc{display:flex;flex-direction:column;gap:3px}
.crewc .crole{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.crewc .cname{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1}
.crewc.vacant{border-style:dashed}
.crewc.board{background:var(--night2)}
.cq{display:flex;align-items:center;gap:8px;margin-top:4px}.cq b{font-family:var(--display);font-size:20px}
.stars{color:#e0a020;letter-spacing:1px}
.ceff{font-weight:600;font-size:13px;margin-top:4px}
.crow.cand{align-items:center}
.av.fog{font-size:12px;color:var(--muted);font-family:Rubik,sans-serif;font-weight:600;min-width:42px}

/* ===================== Theme „Manager-Zentrale“ (PC) ===================== */
.pro-only{display:none!important}
html.pro .pro-only{display:flex!important}
html.pro .crumb.pro-only{display:block!important}
html.pro{
  --night:#0e1116;--night2:#141820;--panel:#181d26;--panel2:#1f2530;--panel3:#283040;--line:#262d39;--line2:#323b4a;
  --text:#e7ebf1;--muted:#98a2b3;--dim:#6b7586;
  --accent:#3b9eff;--accent-ink:#ffffff;--accent-soft:rgba(59,158,255,.13);
  --good:#36c983;--bad:#ff5a5f;--info:#3b9eff;--gold:#f2c14e;--blue:#3b9eff;
  --go:#22b573;--go2:#1a9a61;
  --r:4px;--r2:3px;--shadow:0 1px 2px rgba(0,0,0,.35);
}
html.pro,html.pro body{font-size:14px;line-height:1.45;letter-spacing:.005em}
html.pro body{background:var(--night)}
html.pro ::-webkit-scrollbar{width:10px;height:10px}html.pro ::-webkit-scrollbar-thumb{background:#2b3341;border-radius:5px;border:2px solid var(--night)}html.pro ::-webkit-scrollbar-track{background:transparent}
/* Rundungen und Glanz raus – kantig, ruhig, professionell */
html.pro :is(.card,.btn,.pill,input,select,textarea,.tw,.modal,.seg,.seg button,.toast,.upd,.acol,.ptile,.cbig>div,.ksum>div,.tl,.nkpi>div,.clist,.cclause,.minp,.chipsel button,.bench,.bp,.rcard,.cday,.ev.goal,.news,.nav a,.vrpanel,.tday,.tunit,.ivo,.mart,.mticker,.pscore>div,.tslot select,.card .card){border-radius:4px}
html.pro .pitch,html.pro .minipitch{border-radius:6px}
html.pro h1,html.pro h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em}
html.pro h2{font-size:24px;font-weight:700;color:#fff;margin-bottom:14px;display:flex;align-items:center;gap:10px}
html.pro .main>h2:first-of-type:before{content:"";width:4px;height:22px;background:var(--club,var(--accent));box-shadow:5px 0 0 var(--club2,transparent);margin-right:6px}
html.pro h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;font-size:13.5px;color:#c9d2df;font-weight:700}
/* Panels mit Titelleiste */
html.pro .card{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:12px 14px}
html.pro .card>h3:first-child{margin:-12px -14px 12px;padding:9px 14px;background:linear-gradient(180deg,#212835,#1c222d);border-bottom:1px solid var(--line);border-radius:4px 4px 0 0}
html.pro .card .card{background:var(--night2);border-color:var(--line)}
html.pro .clist{background:var(--night2)}
/* Kopfzeile */
html.pro .top{background:#0b0e13;backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:1px solid #1d232d;padding-top:calc(8px + var(--sat));padding-bottom:8px;box-shadow:0 2px 0 var(--club,var(--accent))}
html.pro .top .brand{font-size:20px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}
html.pro .top .brand i{width:8px;height:20px;border-radius:1px;background:var(--club,var(--accent));box-shadow:4px 0 0 var(--club2,#fff)}
html.pro .top .meta{gap:22px}
html.pro .top .meta .stat{border-left:1px solid #222a36;padding-left:14px}
html.pro .top .meta .stat span{text-transform:uppercase;letter-spacing:.08em;font-size:10px;color:var(--dim)}
html.pro .top .meta .stat b{font-size:18px;color:#fff}
html.pro .btn.pri.adv{background:var(--go);border-color:var(--go);color:#fff;font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:16px;padding:9px 26px;box-shadow:0 0 0 1px rgba(0,0,0,.3) inset}
html.pro .btn.pri.adv:hover{background:var(--go2)}
/* Seitenleiste */
html.pro .side{background:#0b0e13;border-right:1px solid #1d232d;padding:10px 0;top:57px;height:calc(100vh - 57px)}
html.pro .nav a{border-radius:0;margin:0;padding:9px 18px;font-size:13px;font-weight:600;color:#9aa4b5;text-transform:uppercase;letter-spacing:.05em;border-left:3px solid transparent}
html.pro .nav a:hover{background:#141a23;color:#fff}
html.pro .nav a.on{background:linear-gradient(90deg,rgba(59,158,255,.16),transparent);color:#fff;border-left-color:var(--accent)}
html.pro .nav a.on:before{display:none}
html.pro .nav a svg{width:17px;height:17px;stroke-width:1.7}
html.pro .shell{grid-template-columns:214px 1fr}
html.pro .main{max-width:1680px;padding:16px 22px 28px}
html.pro .crumb{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px}
html.pro .crumb span{margin:0 6px;color:#465063}
/* Knöpfe, Pillen, Eingaben */
html.pro .btn{background:#222936;border:1px solid #2f3846;padding:7px 14px;font-size:13px;font-weight:600;box-shadow:none}
html.pro .btn:hover{background:#2a3241;border-color:#3a4456}
html.pro .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:none}
html.pro .btn.pri:hover{filter:brightness(1.08)}
html.pro .btn.sm{padding:4px 10px;font-size:12px}
html.pro .pill{background:#1f2632;border-color:#2e3746;font-size:11.5px;padding:1px 8px}
html.pro input,html.pro select,html.pro textarea{background:#10141b;border-color:#2b3341;padding:6px 10px}
/* Tabs als Reiterleiste */
html.pro .seg{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0;gap:0}
html.pro .seg button{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 14px;color:var(--muted);font-weight:600;text-transform:uppercase;font-size:12.5px;letter-spacing:.06em;margin-bottom:-1px}
html.pro .seg button.on{background:transparent;color:#fff;border-bottom-color:var(--accent);box-shadow:none}
html.pro .seg button:hover{color:#fff}
/* Tabellen – dicht und sachlich */
html.pro table{border-collapse:collapse;font-size:13px}
html.pro th{background:#1a2029;color:#8792a4;text-transform:uppercase;letter-spacing:.07em;font-size:10.5px;font-weight:700;border-bottom:1px solid var(--line2)}
html.pro td{border-bottom:1px solid #20262f;padding-top:6px;padding-bottom:6px}
html.pro tbody tr:nth-child(even) td{background:rgba(255,255,255,.012)}
html.pro tbody tr:hover td{background:rgba(59,158,255,.06)}
html.pro tr.me td{background:rgba(59,158,255,.11)!important;box-shadow:inset 0 0 0 0 transparent}
/* Nachrichten & Meldungen */
html.pro .news{background:#141922;border:1px solid var(--line);border-left:3px solid var(--line2)}
html.pro .modal{border-color:#323b4a;box-shadow:0 20px 60px rgba(0,0,0,.6)}
html.pro .toast{border-radius:4px}
/* Mobil: flache Leiste statt schwebender Pille */
@media (max-width:900px){
  html.pro .bnav{left:0;right:0;bottom:0;border-radius:0;border:0;border-top:1px solid #1d232d;background:#0b0e13;backdrop-filter:none;padding-bottom:var(--sab)}
  html.pro .bnav a{text-transform:uppercase;letter-spacing:.04em;font-size:9.5px}
  html.pro .bnav a.on{color:#fff;box-shadow:inset 0 2px 0 var(--accent)}
  html.pro .main{padding:12px 12px calc(84px + var(--sab))}
  html.pro .top .meta .stat{border-left:0;padding-left:0}
  html.pro .shell{grid-template-columns:1fr}
  html.pro .hide-m.pro-only{display:none!important}
  html.pro .btn.pri.adv{padding:8px 16px;font-size:15px}
}
</style>
