/* ---------- KI-Standardverträge (deterministisch, werden nicht gespeichert) ---------- */
function aiContract(p){
  const c=p.club!==null?club(p.club):null;if(!c)return {};
  const R=mkRng(hashStr('ct'+p.id+':'+p.until+':'+p.club)),W=p.wage,L=league(c),ct={};
  const lvl=(pr,max)=>R()<pr?1+Math.floor(R()*max):0;
  const set=(k,l)=>{const b=BONUS_BY[k];if(l&&bonusApplies(b,p,c))ct[k]=bonusAmount(b,l,W)};
  set('ap',lvl(.8,2));set('gl',lvl(.7,3));set('as',lvl(.35,2));set('cs',lvl(.6,2));set('ti',lvl(.5,2));set('cu',lvl(.35,2));set('pr',lvl(.6,2));set('ic',lvl(.45,2));set('lo',lvl(.25,2));
  if(R()<.3)ct.ri=RAISE.ri[1+Math.floor(R()*2)];
  if(p.age<=23&&R()<.35)ct.ar=RAISE.ar[1+Math.floor(R()*2)].slice();
  if(L&&L.tier>1&&R()<.45)ct.up=RAISE.up[1+Math.floor(R()*2)];
  if(L&&L.down&&c.expRank>L.clubs.length/2&&R()<.4)ct.dn=RAISE.dn[1+Math.floor(R()*2)];
  // Spanien: Ausstiegsklausel gesetzlich üblich (cláusula de rescisión), sonst gelegentlich
  if(c.assoc==='ESP'){ct.rc=nice(Math.max(p.val,5e5)*(3+R()*7));ct.rt='all'}
  else if(R()<.2){const ty=['all','all','foreign','higher','intl','releg'][Math.floor(R()*6)];
    ct.rt=ty==='higher'&&(!L||L.tier===1)?'foreign':ty==='releg'&&(!L||!L.down)?'all':ty;ct.rc=nice(Math.max(p.val,2e5)*(ct.rt==='releg'?.8+R():1.5+R()*3));
    const w=R();if(ct.rt!=='releg'&&w<.2)ct.rf=`${p.until}-07-01`;else if(ct.rt!=='releg'&&w<.35)ct.ru=`${p.until-1}-08-31`}
  return ct;
}
function contractOf(p){return p.ct||aiContract(p)}
function materializeContract(p){if(!p.ct)p.ct=aiContract(p);p.ct.n=p.ct.n||0;return p.ct}

/* ---------- Spielkalender: Woche → Datum (Saison läuft vom 15.07. bis ca. 31.05.) ---------- */
function gameDate(week){const d=new Date(Date.UTC(S.season,6,15));d.setUTCDate(d.getUTCDate()+Math.round((week===undefined?S.week:week)*320/Math.max(S.weeks,1)));return d.toISOString().slice(0,10)}
const fmtDate=iso=>iso?iso.split('-').reverse().join('.'):'';
const isoDays=iso=>Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10))/864e5;
function addDaysIso(iso,n){const d=new Date(Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10)));d.setUTCDate(d.getUTCDate()+Math.round(n));return d.toISOString().slice(0,10)}
// Gültigkeit der Ausstiegsklausel: rf = gültig ab, ru = gültig bis (jeweils inklusive, ISO-Datum)
function clauseState(ct,date){date=date||gameDate();if(ct.rf&&date<ct.rf)return 'pre';if(ct.ru&&date>ct.ru)return 'post';return 'on'}
function clauseWindowText(ct){return ct.rf&&ct.ru?`${fmtDate(ct.rf)} – ${fmtDate(ct.ru)}`:ct.rf?`ab ${fmtDate(ct.rf)}`:ct.ru?`bis ${fmtDate(ct.ru)}`:'gesamte Vertragslaufzeit'}
// Anteil der Restlaufzeit, in dem die Klausel gilt
function clauseShare(ct,start,end){const a=isoDays(start),b=isoDays(end);if(b<=a)return 0;const x=Math.max(a,ct.rf?isoDays(ct.rf):a),y=Math.min(b,ct.ru?isoDays(ct.ru):b);return clamp((y-x)/(b-a),0,1)}
function clauseWatch(){
  const u=userClub();if(!u)return;
  for(const p of squadOf(u)){const ct=p.ct;if(!ct||!ct.rc||(!ct.rf&&!ct.ru))continue;const st=clauseState(ct);
    if(ct.cst&&ct.cst!==st){
      if(st==='on')addNews('transfer',`Ausstiegsklausel aktiv: ${fullname(p)}`,`Ab sofort darf ${esc(pname(p))} für <b>${money(ct.rc)}</b> wechseln (${CLAUSE_TYPES[ct.rt||'all']}, ${clauseWindowText(ct)}).`);
      if(st==='post')addNews('transfer',`Ausstiegsklausel verstrichen: ${fullname(p)}`,`Die Klausel über ${money(ct.rc)} ist am ${fmtDate(ct.ru)} abgelaufen – ein Wechsel geht jetzt nur noch mit deiner Zustimmung.`);
    }ct.cst=st}
}

/* ---------- Ausstiegsklausel ---------- */
function inIntlComp(c){return (S.comps||[]).some(C=>!C.bg&&(C.teams||[]).includes(c.id))}
function clauseApplies(p,buyer,ct){
  ct=ct||contractOf(p);if(!ct.rc||p.club===null||clauseState(ct)!=='on')return false;const s=club(p.club);if(!s||!buyer||buyer.id===s.id)return false;
  const Ls=league(s),Lb=league(buyer);
  switch(ct.rt){
    case 'foreign':return buyer.assoc!==s.assoc;
    case 'higher':return !!(Ls&&Lb&&buyer.assoc===s.assoc&&Lb.tier<Ls.tier);
    case 'intl':return inIntlComp(buyer);
    case 'releg':return s.relegS===S.season;
    default:return true;
  }
}
function buyFee(p,buyer){const a=askPrice(p),ct=contractOf(p);if(clauseApplies(p,buyer,ct)&&ct.rc<a)return {fee:ct.rc,clause:true};return {fee:a,clause:false,rc:ct.rc&&clauseApplies(p,buyer,ct)?ct.rc:0}}

/* ---------- Erwartungswerte & Bewertung durch den Spieler ---------- */
function clubOdds(c){
  const L=league(c);if(!L)return {title:0,cup:.02,promo:0,releg:0,intl:0};
  const n=L.clubs.length,r=c.expRank||Math.ceil(n/2);
  return {title:r===1?.45:r===2?.22:r===3?.1:r<=5?.04:.01,cup:r<=2?.22:r<=5?.1:.03,
    promo:L.tier>1&&L.up?(r<=L.up?.55:r<=L.up*2?.2:.05):0,
    releg:L.down?(r>n-L.down?.5:r>n-2*L.down?.2:.04):0,
    intl:L.tier===1?(r<=3?.85:r<=6?.45:r<=9?.15:.03):0};
}
function expStats(p,c,role){
  const L=league(c),games=(L?L.fixtures.length:34)+5,apps=games*clamp(ROLES[role].exp+.08,0,1);
  return {apps,g:apps*RATE_G[p.pos]*Math.pow(at(p,'fin')/12,1.4),a:apps*RATE_A[p.pos],cs:DEF_POS[p.pos]?apps*.3:0};
}
function wishes(p){
  const w=[],o=ovr(p);
  if(at(p,'amb')>=14||p.pot>=o+6)w.push('rc');
  if(p.pos==='TW')w.push('cs');else if(RATE_G[p.pos]>=.2&&at(p,'fin')>=13)w.push('gl');
  if(p.age>=29)w.push('lo');else if(p.age<=23)w.push('ar');
  if(at(p,'prf')>=15&&w.length<3)w.push('ti');
  return w.slice(0,3);
}
const WISH_LABEL={rc:'Ausstiegsklausel',cs:'Zu-null-Prämie',gl:'Torprämie',lo:'Treueprämie',ar:'Gehaltserhöhung nach Einsätzen',ti:'Meisterprämie'};
function bonusEV(p,c,ct,role){
  const E=expStats(p,c,role),O=clubOdds(c);
  return {ap:(ct.ap||0)*E.apps,gl:(ct.gl||0)*E.g,as:(ct.as||0)*E.a,cs:(ct.cs||0)*E.cs,ti:(ct.ti||0)*O.title,cu:(ct.cu||0)*O.cup,pr:(ct.pr||0)*O.promo,ic:(ct.ic||0)*O.intl,lo:ct.lo||0};
}
function clauseWorth(p,c,ct,years){
  if(!ct.rc)return 0;const now=gameDate(),share=clauseShare(ct,now,addDaysIso(now,Math.max(.25,years||1)*365));const O=clubOdds(c),L=league(c);
  const cheap=1-clamp((ct.rc/Math.max(p.val,1e5)-1)/4,0,1);
  const typeF={all:1,foreign:.6,higher:L&&L.tier>1?.7:.05,intl:.7,releg:clamp(O.releg*2.5,0,1)*.5}[ct.rt||'all'];
  return (at(p,'amb')/20)*.12*cheap*typeF*(.25+.75*share)*(share>0?1:0);
}
// Wert des Pakets aus Sicht des Spielers, umgerechnet in garantiertes Wochengehalt
function ctValue(p,c,ct,W,years,role){
  const ev=bonusEV(p,c,ct,role),wi=wishes(p),O=clubOdds(c),E=expStats(p,c,role);
  let b=0;for(const k in ev)b+=ev[k]*(wi.includes(k)?1.3:1);
  let v=W+b*.8/52+(ct.si||0)*.9/(Math.max(1,years)*52);
  if(ct.ri)v+=W*(ct.ri/100)*(years-1)/2*.85;
  if(ct.ar){const tot=E.apps*years,frac=tot>ct.ar[0]?1-ct.ar[0]/tot:0;v+=W*ct.ar[1]/100*frac*.85*(wi.includes('ar')?1.3:1)}
  if(ct.up)v+=W*ct.up/100*O.promo*.8;
  if(ct.dn)v-=W*ct.dn/100*O.releg*1.25;
  v+=W*clauseWorth(p,c,ct,years)*(wi.includes('rc')?1.5:1);
  return v;
}
function ctCostSeason(p,c,ct,W,role){const ev=bonusEV(p,c,ct,role);let b=0;for(const k in ev)b+=ev[k];return {wage:W*52,bonus:b}}

/* ---------- Auszahlungen (nur für den eigenen Verein) ---------- */
function payBonus(amt,why){
  if(!amt)return;const u=userClub();u.budget-=amt;S.fin.bonus=(S.fin.bonus||0)+amt;
  if(why){S.fin.bon=S.fin.bon||{};S.fin.bon[why]=(S.fin.bon[why]||0)+amt}
}
function matchBonuses(c,res,ga){
  if(c.id!==S.user||!S.fin)return;const slots=FORMATIONS[c.tactic.f].s;
  c.lineup.forEach((id,i)=>{
    const p=id&&S.players[id];if(!p||!p.ct)return;const ct=p.ct,x=(res.st&&res.st[id])||{g:0,a:0};
    let amt=0;
    if(ct.ap){amt+=ct.ap;payBonus(ct.ap,'ap')}
    if(ct.gl&&x.g){payBonus(ct.gl*x.g,'gl');amt+=ct.gl*x.g}
    if(ct.as&&x.a){payBonus(ct.as*x.a,'as');amt+=ct.as*x.a}
    if(ct.cs&&ga===0&&DEF_POS[slots[i]]){payBonus(ct.cs,'cs');amt+=ct.cs}
    ct.pd=(ct.pd||0)+amt;ct.n=(ct.n||0)+1;
    if(ct.ar&&!ct.ad&&ct.n>=ct.ar[0]){ct.ad=1;const old=p.wage;p.wage=p.wage*(1+ct.ar[1]/100);
      addNews('transfer',`Gehaltserhöhung: ${fullname(p)}`,`Nach ${ct.ar[0]} Pflichtspielen greift die Vertragsklausel: +${ct.ar[1]} % – neu ${money(mon(p.wage))}/Monat (vorher ${money(mon(old))}).`)}
  });
}
function teamBonus(k,label){
  const u=userClub();let tot=0,n=0;
  for(const p of squadOf(u)){const v=p.ct&&p.ct[k];if(!v)continue;payBonus(v,k);p.ct.pd=(p.ct.pd||0)+v;tot+=v;n++}
  if(tot)addNews('board',`${BONUS_BY[k].lbl} ausgezahlt`,`${label}: ${n} Spieler erhalten zusammen <b>${money(tot)}</b>.`);
}
// Saisonende: Meister, Aufstieg/Abstieg, Treue, jährliche Steigerung
function seasonContracts(info){
  const u=userClub();if(!u)return;
  if(info.champ)teamBonus('ti','Meisterschaft');
  if(info.promo)teamBonus('pr','Aufstieg');
  teamBonus('lo','Vertragstreue');
  const msgs=[];
  for(const p of squadOf(u)){
    const ct=p.ct;if(!ct||p.until<=S.season)continue;const old=p.wage;let f=1;
    if(ct.ri)f*=1+ct.ri/100;if(info.promo&&ct.up)f*=1+ct.up/100;if(info.releg&&ct.dn)f*=1-ct.dn/100;
    if(f!==1){p.wage=old*f;msgs.push(`${esc(pname(p))} ${f>1?'+':''}${Math.round((f-1)*100)} %`)}
  }
  if(msgs.length)addNews('transfer','Vertragliche Gehaltsanpassungen',`Zum neuen Vertragsjahr: ${msgs.join(', ')}.`);
  for(const p of squadOf(u))if(p.ct)p.ct.pd=0;
}

/* ---------- Ausstiegsklausel: erst Vertragsgespräche mit dem Spieler, dann Zahlung ----------
   Ein KI-Verein, der die Klausel eines deiner Spieler ziehen will, muss sich zuerst mit dem Spieler
   über einen Vertrag einigen. Erst wenn der Spieler zusagt, wird die Klausel gezahlt und er wechselt. */
function windowEnd(){return S.week<4?3:winterStart()+2}
function activeTalk(pid){return (S.talks||[]).find(t=>t.pid===pid&&t.st==='open')}
/* ---------- Berater ---------- */
const AGENT_TYPES={
 fast:{lbl:'Zügiger Abwickler',d:-1,pay:1,stay:0,desc:'will schnell Klarheit und hält Fristen ein'},
 poker:{lbl:'Pokerspieler',d:1.5,pay:1.35,stay:0,desc:'zieht Gespräche in die Länge, um mehr herauszuholen'},
 family:{lbl:'Familienberater',d:.5,pay:.8,stay:.1,desc:'achtet auf das Umfeld, rät eher zum Bleiben'},
 biz:{lbl:'Geschäftsmann',d:0,pay:1.3,stay:0,desc:'Geld steht im Vordergrund'}};
const AGENCIES=['Sports Management','Football Agency','Player Consulting','Sportsmanagement','Talent Group','Pro Sports'];
function agentOf(p){
  const R=mkRng(hashStr('ag'+p.id)),pool=poolArr(ASSOC[p.nat]?ASSOC[p.nat].pool:'de'),r=R();
  const type=r<.28?'fast':r<.52?'poker':r<.72?'family':'biz';
  const ln=pool.l[Math.floor(R()*pool.l.length)];
  return {name:pool.f[Math.floor(R()*pool.f.length)]+' '+ln,agency:ln+' '+AGENCIES[Math.floor(R()*AGENCIES.length)],type,...AGENT_TYPES[type]};
}
/* Sportliche Lage eines Vereins aus Sicht des Spielers: +1 = top, −1 = Krise */
function clubSituation(c){
  const L=league(c);if(!L)return {v:0,txt:'keine Ligaspiele'};
  const n=L.clubs.length,early=S.week<3,r=early?(c.lastRank||c.expRank):rankOf(c.id),exp=c.expRank||Math.ceil(n/2),where=early?(c.lastRank?'letzte Saison Platz':'Prognose Platz'):'aktuell Platz';
  if(L.down&&r>n-L.down)return {v:-1,txt:`Abstiegskampf (${where} ${r})`};
  if(r<=2&&L.tier===1)return {v:1,txt:`Titelkampf (${where} ${r})`};
  if(L.tier>1&&L.up&&r<=L.up)return {v:.7,txt:`Aufstiegskurs (${where} ${r})`};
  if(r<=exp-3)return {v:.6,txt:`läuft besser als erwartet (${where} ${r})`};
  if(r>=exp+4)return {v:-.6,txt:`sportliche Krise (${where} ${r})`};
  return {v:0,txt:`im Soll (${where} ${r})`};
}
/* Individuelle Verhandlungsdauer in Wochen – mit Begründung */
function talkDuration(p,seller){
  const A=agentOf(p),sit=clubSituation(seller),why=[];let d=2;
  d+=A.d;why.push(`Berater ${A.name}: ${A.lbl}${A.d>0?' – zieht die Gespräche in die Länge':A.d<0?' – will schnell Klarheit':''}`);
  if(p.mor>=75){d+=1;why.push(`Moral hoch (${Math.round(p.mor)}) – fühlt sich wohl, zögert`)}
  else if(p.mor<45){d-=1;why.push(`Moral niedrig (${Math.round(p.mor)}) – will schnell weg`)}
  else why.push(`Moral durchschnittlich (${Math.round(p.mor)})`);
  if(sit.v>=.6){d+=1;why.push(`Verein: ${sit.txt} – er überlegt lange`)}
  else if(sit.v<=-.6){d-=.7;why.push(`Verein: ${sit.txt} – Wechsel ist reizvoll`)}
  else why.push(`Verein: ${sit.txt}`);
  if(inIntlComp(seller)){d+=.5;why.push('spielt mit seinem Verein international')}
  const winter=S.week>=winterStart();if(winter){d-=.5;why.push('Winterfenster – wenig Zeit')}
  else if(S.week===0)why.push('Fenster hat gerade erst geöffnet – genug Zeit');
  d+=(mkRng(hashStr('dur'+p.id+':'+S.season+':'+S.week))()-.5);
  let w=clamp(Math.round(d),1,5);const left=windowEnd()-S.week;let deadline=false;
  if(w>=left){w=left;deadline=true;const k=why.indexOf('Fenster hat gerade erst geöffnet – genug Zeit');if(k>=0)why.splice(k,1);why.push(left<=0?'Deadline Day – Entscheidung noch heute':`Fensterschluss in ${left} ${left===1?'Woche':'Wochen'} – Entscheidung am letzten Tag`)}
  return {w,deadline,why,agent:A,sit};
}
function talkVisible(t){const u=userClub();return t.seller===S.user||t.from===S.user||[t.from,t.seller].some(id=>{const x=club(id);return x&&(x.league===u.league||x.assoc===u.assoc)})}
function startClauseTalk(p,c,fee){
  S.talks=S.talks||[];
  if(S.talks.some(t=>t.pid===p.id&&(t.st==='open'||t.from===c.id)))return true; // läuft schon / Verein hat es diese Saison schon versucht
  if(S.talks.some(t=>t.from===c.id&&t.st==='open'))return true;
  const seller=club(p.club);
  if(S.week>=windowEnd()&&seller.id===S.user)return false; // dir bleibt sonst keine Zeit zu reagieren
  const role=suggestRole(p,c),wage=rw(Math.max(aiWageFor(p,c),p.wage*(1.08+rnd()*.35))),years=p.age>=31?ri(1,2):ri(3,5);
  const D=talkDuration(p,seller),dec=S.week+D.w;
  const t={id:'t'+(S.nextId++),pid:p.id,from:c.id,seller:seller.id,fee,wage,role,years,w:S.week,dec,st:'open',dur:D.w,deadline:D.deadline,why:D.why};
  S.talks.push(t);
  if(seller.id===S.user){
    addNews('offer',`Ausstiegsklausel: ${esc(c.name)} verhandelt mit ${fullname(p)}`,`${esc(c.name)} (${esc(leagueName(c))}) will die Klausel über <b>${money(fee)}</b> ziehen und führt Vertragsgespräche mit ${esc(pname(p))}. Laut seinem Berater geht es um rund <b>${money(mon(wage))}</b> brutto/Monat als ${ROLES[role].label} (bei dir aktuell ${money(mon(p.wage))}). Er entscheidet sich bis Woche ${dec+1} (${fmtDate(gameDate(dec))}) – ${D.deadline?'Entscheidung erst zum Fensterschluss':'Verhandlungsdauer ca. '+D.w+' '+(D.w===1?'Woche':'Wochen')}. Gründe: ${D.why.map(esc).join('; ')}. Du kannst den Vertrag nachbessern, um ihn zu halten – an der Klausel selbst lässt er jetzt nicht mehr rütteln.`);
  }else{
    // Der abgebende KI-Verein reagiert: wichtige Spieler sollen mit einem besseren Vertrag gehalten werden
    const key=seller.lineup.includes(p.id)||ROLE_ORDER.indexOf(p.role)<=1,trait=seller.staff.pres.trait;
    const keen=key?(trait==='sparsam'?.35:.65):.15,room=seller.wBudget-wageBill(seller);
    if(rnd()<keen){const nw=rw(Math.min(p.wage+Math.max(0,room),t.wage*(.9+rnd()*.2)));
      if(nw>p.wage){t.counter={old:p.wage,nw};p.wage=nw;p.mor=clamp(p.mor+8,15,100)}}
    if(talkVisible(t))addNews('transfer',`${esc(c.short)} will Ausstiegsklausel bei ${fullname(p)} ziehen`,`${esc(c.name)} verhandelt mit ${esc(pname(p))} (${esc(seller.name)}) über einen Wechsel – Klausel: ${money(fee)}.${t.counter?` ${esc(seller.name)} bessert nach und erhöht sein Gehalt auf ${money(mon(t.counter.nw))}/Monat.`:''} Entscheidung bis Woche ${dec+1}${D.deadline?' (Deadline Day)':''}.`);
  }
  return true;
}
// Wie wahrscheinlich sagt der Spieler dem neuen Verein zu?
function talkChance(t){
  const p=S.players[t.pid],c=club(t.from),u=club(t.seller!==undefined?t.seller:S.user);if(!p||!c||!u)return 0;
  const ri_=ROLE_ORDER.indexOf(t.role)-ROLE_ORDER.indexOf(p.role);
  const pay=t.wage/Math.max(1,p.wage)-1,A=agentOf(p),sit=clubSituation(u);
  return clamp(.3+pay*1.1*A.pay-A.stay-sit.v*.09+(t.deadline?.04:0)+(c.rep-u.rep)/30+(at(p,'amb')-10)/35-(p.mor-60)/120-(c.assoc!==u.assoc?(10-at(p,'ada'))/30:0)-ri_*.08-(inIntlComp(c)?0:inIntlComp(u)?.08:0),.03,.95);
}
function clauseTalksWeekly(){
  for(const t of S.talks||[]){
    if(t.st!=='open'||S.week<t.dec)continue;
    const p=S.players[t.pid],c=club(t.from),sid=t.seller!==undefined?t.seller:S.user,mine=sid===S.user,vis=talkVisible(t),sn=club(sid)?club(sid).name:'';
    if(!p||!c||p.club!==sid){t.st='void';continue}
    const ct=contractOf(p);
    if(!clauseApplies(p,c,ct)){t.st='void';if(vis)addNews('transfer',`Klausel greift nicht mehr: ${fullname(p)}`,`${esc(c.name)} kann die Ausstiegsklausel nicht mehr ziehen – ${esc(pname(p))} bleibt.`);continue}
    const fee=Math.min(t.fee,ct.rc||t.fee);
    if(c.budget<fee||!isWindow()){t.st='void';if(vis)addNews('transfer',`Wechsel geplatzt: ${fullname(p)}`,`${esc(c.name)} bekommt die Ablöse von ${money(fee)} nicht rechtzeitig zusammen. ${esc(pname(p))} bleibt.`);continue}
    if(agentOf(p).type==='poker'&&!t.poked){t.poked=1;const nw=rw(t.wage*(1.05+rnd()*.08));if(c.wBudget-wageBill(c)>=nw||c.id!==S.user){t.wage=nw;if(mine||vis)addNews('transfer',`Berater pokert: ${fullname(p)}`,`${esc(agentOf(p).name)} hat bei ${esc(c.name)} kurz vor der Entscheidung noch mehr herausgeholt: jetzt ${money(mon(nw))} brutto/Monat.`)}}
    if(rnd()<talkChance(t)){
      t.st='done';const nm=fullname(p);
      doTransfer(p,c,fee,{wage:t.wage,until:S.season+t.years-(S.week<winterStart()?1:0),role:t.role});trimSquad(c);
      if(mine)addNews('offer',`Ausstiegsklausel gezogen: ${nm}`,`${esc(pname(p))} hat sich mit ${esc(c.name)} geeinigt (${money(mon(t.wage))} brutto/Monat, ${ROLES[t.role].label}). Der Verein hat die Klausel gezogen und <b>${money(fee)}</b> überwiesen – der Wechsel ist perfekt, du konntest ihn nicht verhindern.`);
      else if(vis)addNews('transfer',`${esc(c.short)}: ${nm} per Ausstiegsklausel`,`${esc(pname(p))} hat sich mit ${esc(c.name)} geeinigt. Die Klausel über ${money(fee)} wurde gezogen – ${esc(sn)} konnte den Wechsel nicht verhindern.`);
    }else{
      t.st='no';p.mor=clamp(p.mor+4,15,100);
      if(mine)addNews('transfer',`${fullname(p)} bleibt!`,`${esc(pname(p))} hat die Gespräche mit ${esc(c.name)} abgebrochen und lehnt den Wechsel ab. Die Klausel wurde nicht gezogen.`);
      else if(vis)addNews('transfer',`${fullname(p)} bleibt bei ${esc(sn)}`,`${esc(pname(p))} hat die Gespräche mit ${esc(c.name)} abgebrochen – die Klausel wird nicht gezogen.${t.counter?' Das verbesserte Vertragsangebot seines Vereins hat gewirkt.':''}`);
    }
  }
}

</script>
<script>
'use strict';
/* =========================================================
   SEITENLINIE – Oberfläche
   ========================================================= */
let UI={view:'home',modal:null,live:null,setup:null,tf:{pos:'',max:'',q:'',tab:'markt',nat:''},mdView:null,selSlot:null,toast:null,sortK:'pos',tableLeague:null,world:{confed:'UEFA',assoc:null},loading:null,meta:null,oldSave:false};

/* ---------- Installierbare Web-App (PWA) ---------- */
const PWA={deferred:null,update:null,
  standalone:(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true,
  ios:/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),
  swOK:'serviceWorker' in navigator&&/^https?:$/.test(location.protocol)};
if(PWA.swOK){
  const hadController=!!navigator.serviceWorker.controller;let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadController||reloading)return;reloading=true;location.reload()});
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      PWA.reg=reg;
      if(reg.waiting&&navigator.serviceWorker.controller){PWA.update=reg.waiting;render()}
      reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){PWA.update=w;render()}})});
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&navigator.onLine)reg.update().catch(()=>{})});
    }).catch(()=>{PWA.swOK=false});
  });
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();PWA.deferred=e;if(!UI.setup)render()});
window.addEventListener('appinstalled',()=>{PWA.deferred=null;toast('App installiert!')});

try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
function updateBanner(){return PWA.update?`<div class="upd">🔄 Neue Version verfügbar <button class="btn sm pri" data-act="applyUpdate">Aktualisieren</button></div>`:''}
function installCard(){

  else if(PWA.deferred)body='<p class="small muted">Installiere Seitenlinie als App: eigenes Symbol, Vollbild, startet auch offline.</p><button class="btn pri" data-act="install">📲 App installieren</button>';
  else if(PWA.ios)body='<p class="small">So installierst du die App auf iPhone/iPad:</p><ol class="small" style="margin:6px 0 0;padding-left:20px"><li>Diese Seite in <b>Safari</b> öffnen</li><li>Auf das <b>Teilen-Symbol</b> ⬆️ tippen</li><li><b>„Zum Home-Bildschirm“</b> wählen</li></ol>';
  else if(PWA.swOK)body='<p class="small">Im Browser-Menü <b>„App installieren“</b> wählen (Chrome/Edge: Symbol rechts in der Adressleiste).</p>';
  else body='<p class="small muted">Installieren geht nur über die Webadresse (https). Als lokale Datei läuft das Spiel trotzdem offline im Browser.</p>';
  return `<div class="card"><h3>Als App installieren</h3>${body}<p class="small muted" style="margin-top:10px">Die installierte App hat einen eigenen Speicher. Spielstände überträgst du per Export/Import.</p></div>`;
}

/* ---------- Grundgerüst ---------- */
const ICONS={
 home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',

 cups:'<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4.5a2.5 2.5 0 0 0 2.6 3.5M17 6h2.5a2.5 2.5 0 0 1-2.6 3.5"/><path d="M12 14v3M8.5 20.5h7l-.8-3.5H9.3z"/>',
 world:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.4 3.6 5.2 3.6 8.5s-1.2 6.1-3.6 8.5c-2.4-2.4-3.6-5.2-3.6-8.5S9.6 5.9 12 3.5z"/>',

const icon=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`;
const NAV=[['home','Übersicht'],['squad','Kader'],['tactic','Taktik'],['fixtures','Spielplan'],['table','Tabelle'],['transfers','Transfers'],['finance','Finanzen'],['cups','Wettbewerbe'],['world','Welt'],['menu','Menü']];
function modalHtml(){return UI.modal?`<div class="ov" data-act="closeModal"><div class="modal" data-stop="1">${UI.modal()}</div></div>`:''}

function render(){
  const app=document.getElementById('app');
  if(UI.loading){app.innerHTML=`<div class="title"><div class="card" style="text-align:center;max-width:420px"><div style="font-size:40px">🌍</div><h2>${UI.loading}</h2><p class="muted small">Einen Moment – Vereine, Kader und Spielpläne werden erzeugt.</p></div></div>`;return}
  if(!S||S.user===null){app.innerHTML=(UI.setup?renderSetup():renderTitle())+updateBanner()+modalHtml()+toastHtml();return}
  const c=userClub(),v=UI.view;
  let body='';
  if(v==='live')body=renderLive();
  else if(v==='matchday')body=renderWeekResults();
  else if(v==='season')body=renderSeasonEndScreen();
  else body=({home:renderHome,squad:renderSquad,tactic:renderTactic,fixtures:renderFixtures,table:renderTable,transfers:renderTransfers,finance:renderFinance,cups:renderCups,world:renderWorld,menu:renderMenu}[v]||renderHome)();
  const nav=NAV.map(([k,l])=>`<a class="${v===k?'on':''}" data-act="nav" data-v="${k}" href="#" aria-label="${l}">${icon(k)}<span>${l}</span></a>`).join('');
  const inLive=v==='live'&&UI.live&&!UI.live.done,over=S.week>=S.weeks;
  const adv=inLive?'':over?`<button class="btn pri" data-act="toSeason">Saisonende ▶</button>`:`<button class="btn pri" data-act="advance">Weiter ▶</button>`;
  app.innerHTML=`<div class="shell">
   <header class="top">
     <div class="brand"><i></i>Seitenlinie</div>
     <div class="club">${badge(c,30)}<div style="min-width:0"><b>${esc(c.name)}</b><div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(league(c).name)} · ${S.season}/${(S.season+1)%100}</div></div></div>
     <div class="meta">${navigator.onLine?'':'<span class="pill" title="Kein Internet – das Spiel läuft trotzdem">📴</span>'}<div class="stat hide-m"><span>Woche</span><b>${Math.min(S.week+1,S.weeks)} / ${S.weeks}</b></div><div class="stat hide-m"><span>Transferbudget</span><b>${money(c.tBudget)}</b></div>${adv}</div>
   </header>
   <nav class="side nav">${nav}</nav>
   <main class="main">${body}</main>
   <nav class="bnav">${nav}</nav>
  </div>${updateBanner()}${modalHtml()}${toastHtml()}`;
}
function toast(msg){UI.toast=msg;render();clearTimeout(toast.t);toast.t=setTimeout(()=>{UI.toast=null;render()},2400)}

/* ---------- Titel ---------- */
function renderTitle(){
  const m=UI.meta;
  return `<div class="title"><div class="card" style="max-width:460px;width:100%;text-align:center;padding:34px 28px 28px">
   <div class="lamps"><i></i><i></i><i></i><i></i><i></i></div><h1 class="wordmark">Seitenlinie</h1><div class="chalk"></div><p class="muted" style="margin:0">Dein Fußball Manager für 211 Verbände – auch ohne Internet.</p>
   <div class="grid" style="margin-top:20px">
    ${m?`<button class="btn pri" style="justify-content:center;padding:12px" data-act="continue">Karriere fortsetzen</button><div class="small muted">${esc(m.club)} · ${esc(m.league)} · Saison ${m.season}/${(m.season+1)%100} · Woche ${Math.min(m.week+1,m.weeks)}</div>`:''}
    <button class="btn ${m?'':'pri'}" style="justify-content:center;padding:12px" data-act="newCareer">Neue Karriere</button>

/* ---------- Karrierestart: Verein wählen, dann Welt ---------- */
function assocLeaguesInfo(code){const st=assocStructure(code,UI.setup.seed);return st}

  const st=UI.setup;

}
function confedTabs(cur,act){return `<div class="seg" style="margin-bottom:10px">${CONFEDS.map(c=>`<button class="${cur===c.id?'on':''}" data-act="${act}" data-v="${c.id}" title="${c.region}">${c.name}</button>`).join('')}</div>`}
function renderSetupClub(){
  const st=UI.setup;
  const q=(st.q||'').toLowerCase();
  const list=ASSOCS.filter(a=>a.confed===st.confed&&(!q||a.name.toLowerCase().includes(q))).sort((a,b)=>b.str-a.str);
  const assocList=list.map(a=>{const d=LEAGUE_DATA[a.code]||{};const nl=d.noLeague;const L=nl?[]:assocLeaguesInfo(a.code);
    return `<div class="card clubpick ${st.assoc===a.code?'on':''}" style="padding:10px" data-act="pickAssoc" data-v="${a.code}"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>${esc(a.name)}</b><span class="small gold">${stars(a.str)}</span></div><div class="small muted">${nl?'keine eigene Liga':L.length+(L.length>1?' Ligen':' Liga')+' · '+L.reduce((s,l)=>s+l.clubs.length,0)+' Vereine'}${d.clubs?' · echte Vereine':''}</div></div>`}).join('');
  let right='<p class="muted">Wähle links einen Verband.</p>';
  if(st.assoc){
    const a=ASSOC[st.assoc],d=LEAGUE_DATA[st.assoc]||{};
    if(d.noLeague)right=`<div class="card"><h2>${esc(a.name)}</h2><p>${esc(d.info)}</p></div>`;
    else{
      const L=assocLeaguesInfo(st.assoc);const tier=Math.min(st.tier,L.length);const lt=L[tier-1];
      const cards=lt.clubs.map((nm,i)=>{const rep=repFor(a,tier,i,lt.clubs.length),econ=econOf(st.assoc,tier),staff=staffForAssoc(nm,st.seed,st.assoc),col=clubColors(nm);
        const fake={colors:col,short:shortName(nm)};const sel=st.pick&&st.pick.code===st.assoc&&st.pick.tier===tier&&st.pick.idx===i;
        return `<div class="card clubpick ${sel?'on':''}" data-act="pickClub" data-i="${i}"><div class="row" style="flex-wrap:nowrap">${badge(fake,34)}<div style="min-width:0"><b>${esc(nm)}</b><div class="small gold">${stars(rep)}</div></div></div>
          <div class="small" style="margin-top:6px">Budget ca. <b>${money(estBudget(rep,econ))}</b> · Stadion ${estStadium(rep,econ).toLocaleString('de-DE')}</div>
          <div class="small muted">Präsident: ${PRES[staff.pres.trait].label} · Sportdir.: ${DIR[staff.dir.trait].label}</div></div>`}).join('');
      right=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(a.name)}</h2><span class="small muted">${a.confed}</span></div>
       <div class="seg" style="margin:10px 0">${L.map(l=>`<button class="${l.tier===tier?'on':''}" data-act="pickTier" data-v="${l.tier}">${esc(l.name)}</button>`).join('')}</div>
       ${lt.real?'':'<p class="small muted">Vereine dieser Liga sind nach echten Städten benannt.</p>'}
       <div class="grid g3">${cards}</div>`;
    }
  }
  const sel=st.pick;
  return `<div class="main" style="margin:auto;padding-top:calc(18px + var(--sat));max-width:1300px">
   <div class="row" style="justify-content:space-between"><h2>Neue Karriere · 1/2 Verein wählen</h2><button class="btn sm" data-act="backTitle">Zurück</button></div>
   <div class="card" style="margin-bottom:12px"><div class="row"><div style="flex:1;min-width:200px"><label class="f">Dein Managername</label><input id="mgrName" value="${esc(st.name)}" placeholder="z. B. Elias" style="width:100%"></div></div></div>
   ${confedTabs(st.confed,'setConfed')}
   <div class="setup-grid"><div><input placeholder="Verband suchen…" value="${esc(st.q||'')}" data-chg="assocQ" style="width:100%;margin-bottom:8px"><div class="grid assoc-list">${assocList||'<p class="muted">Kein Verband gefunden.</p>'}</div></div><div id="assocRight">${right}</div></div>
   <div class="sticky-cta">
    <button class="btn pri" style="width:100%;justify-content:center;padding:13px" data-act="toWorldStep" ${sel?'':'disabled'}>${sel?'Weiter mit '+esc(assocStructure(sel.code,st.seed)[sel.tier-1].clubs[sel.idx])+' ▶':'Verein auswählen'}</button>

function worldSize(codes){let clubs=0;for(const c of codes)assocStructure(c,UI.setup.seed).forEach(l=>clubs+=l.clubs.length);return {clubs,players:clubs*27}}
const PRESETS=[
 ['Nur mein Land',()=>[]],
 ['Top 5 Europas',()=>['ENG','ESP','GER','ITA','FRA']],
 ['Europa Top 12',()=>['ENG','ESP','GER','ITA','FRA','POR','NED','BEL','TUR','AUT','SUI','SCO']],
 ['Südamerika',()=>['BRA','ARG','COL','URU','CHI','ECU','PAR','PER']],

  const st=UI.setup,act=st.active,size=worldSize([...act]);
  const warn=size.players>9000?'bad':size.players>5000?'gold':'good';
  const conf=st.wconfed||st.confed;
  const list=ASSOCS.filter(a=>a.confed===conf&&!(LEAGUE_DATA[a.code]||{}).noLeague).sort((a,b)=>b.str-a.str).map(a=>{
    const on=act.has(a.code),locked=a.code===st.pick.code;
    return `<label class="card clubpick ${on?'on':''}" style="padding:8px 10px;display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" data-chg="actToggle" data-v="${a.code}" ${on?'checked':''} ${locked?'disabled':''}><span style="flex:1"><b>${esc(a.name)}</b> <span class="small gold">${stars(a.str)}</span><br><span class="small muted">${assocStructure(a.code,st.seed).map(l=>esc(l.name)).join(' · ')}</span></span></label>`}).join('');

   <div class="row" style="justify-content:space-between"><h2>Neue Karriere · 2/2 Welt einrichten</h2><button class="btn sm" data-act="backClubStep">◀ Zurück</button></div>
   <div class="card" style="margin-bottom:12px"><p style="margin:0">Alle <b>211 Verbände</b> sind dabei. Die Länder, die du hier auswählst, werden <b>voll simuliert</b>: echte Spielpläne, Kader und Transfers. Alle anderen laufen im Hintergrund mit, dort wird pro Saison nur der Meister ermittelt.</p>
    <div class="row" style="margin-top:10px">${PRESETS.map((p,i)=>`<button class="btn sm" data-act="preset" data-i="${i}">${p[0]}</button>`).join('')}</div>
    <div class="small" style="margin-top:10px">Aktiv: <b>${act.size}</b> Länder · ca. <b>${size.clubs}</b> Vereine · <b class="${warn}">${size.players.toLocaleString('de-DE')}</b> Spieler ${size.players>9000?'– auf Handys/iPads spürbar langsamer':size.players>5000?'– auf älteren Handys etwas langsamer':''}</div></div>
   ${confedTabs(conf,'setWConfed')}
   <div class="grid g3">${list}</div>
   <div class="sticky-cta">
    <button class="btn pri" style="width:100%;justify-content:center;padding:13px" data-act="startCareer">Karriere starten ▶</button></div></div>`;
}

/* ---------- Übersicht ---------- */
function nextUserGames(){
  const list=[];const nx=nextUserMatch();if(nx)list.push({w:nx.w,m:nx.m,comp:null,order:0});
  for(const f of userCompFixtures())if(f.m.hg===null&&f.w>=S.week)list.push({w:f.w,m:f.m,comp:f.C,label:COMP[f.C.key].short+' · '+f.label,order:1});
  for(const f of userNatCupFixtures())if(f.m.hg===null&&f.w>=S.week)list.push({w:f.w,m:f.m,comp:f.cup,label:f.cup.name+' · '+f.label,order:2});
  for(const f of userSupercupFixtures())if(f.m.hg===null&&f.w>=S.week)list.push({w:f.w,m:f.m,comp:f.sc,label:f.sc.name+' · '+f.label,order:-1});
  return list.sort((a,b)=>a.w-b.w||a.order-b.order).filter((g,i,arr)=>g.w===arr[0].w);
}
function renderHome(){
  const c=userClub(),L=league(c),tab=tableOf(L),rank=tab.findIndex(r=>r.id===S.user)+1,me=tab[rank-1];
  const nx=nextUserMatch(),ng=nextUserGames();
  let next='<p class="muted">Die Saison ist beendet. Tippe auf „Saisonende“.</p>';
  if(ng.length){
    const g=ng[0],m=g.m,opp=club(m.h===S.user?m.a:m.h),home=m.h===S.user;const co=COACH[opp.staff.coach.trait];
    const wait=g.w>S.week?`<div class="pill wrap" style="margin-bottom:8px">Diese Woche spielfrei – nächstes Spiel in Woche ${g.w+1}</div>`:'';
    const more=ng.length>1&&ng[1].w===g.w?`<div class="pill wrap" style="margin-bottom:8px;border-color:var(--gold)">Englische Woche: ${ng.length} Spiele in Woche ${g.w+1}</div>`:'';
    const sub=g.comp?`${esc(g.label)} · ${esc(leagueName(opp))}`:`${nx.r+1}. Spieltag · Platz ${tab.findIndex(r=>r.id===opp.id)+1}`;
    const hc=home?c:opp,ac=home?opp:c;
    next=`${wait}${more}<div class="small muted" style="text-align:center">${sub}</div>
    <div class="vs"><div class="team">${badge(hc,54)}<b>${esc(hc.name)}</b><span class="small muted">Stärke ${clubAvg(hc)}</span></div><div class="mid">vs<small>${home?'Heimspiel':'Auswärtsspiel'}</small></div><div class="team">${badge(ac,54)}<b>${esc(ac.name)}</b><span class="small muted">Stärke ${clubAvg(ac)}</span></div></div>
    <div class="small" style="text-align:center">Gegnertrainer <b>${esc(opp.staff.coach.name)}</b>, ${co.label}. <span class="muted">${co.desc}</span></div>`;
  }
  const talks=(S.talks||[]).filter(t=>t.st==='open'&&(t.seller===undefined||t.seller===S.user)).map(t=>{const p=S.players[t.pid],fc=club(t.from);if(!p||!fc)return '';const ch=talkChance(t);
    return `<div class="news t-offer"><b>⚡ ${esc(fc.name)}</b> verhandelt über die Ausstiegsklausel (${money(t.fee)}) mit ${esc(fullname(p))} ${ovrTag(ovr(p))}

/* ---------- Vertragsverhandlung ---------- */
function negCt(N,p,u){
  const W=wk(N.mw),ct={},lock=N.mode==='extend'&&activeTalk(p.id);
  for(const b of BONUS){const v=N.b[b.k]||0;if(v>0&&bonusApplies(b,p,u))ct[b.k]=Math.round(v)}
  if(N.ri)ct.ri=RAISE.ri[N.ri];if(N.ar)ct.ar=RAISE.ar[N.ar].slice();
  const L=league(u);if(N.up&&L&&L.tier>1)ct.up=RAISE.up[N.up];if(N.dn&&L&&L.down)ct.dn=RAISE.dn[N.dn];
  if(lock){const cur=contractOf(p);for(const k of ['rc','rt','rf','ru'])if(cur[k]!==undefined)ct[k]=cur[k]}
  else if(N.rt!=='none'&&N.rc>0){ct.rc=N.rc;ct.rt=N.rt;if((N.rw==='from'||N.rw==='range')&&N.rf)ct.rf=N.rf;if((N.rw==='until'||N.rw==='range')&&N.ru)ct.ru=N.ru}
  return ct;
}
function negYears(N,p){return N.years===0?Math.max(1,p.until-S.season+(S.week<winterStart()?1:.5)):N.years}
function negDemand(N,p,u){
  if(N.years===0){const cur=p.ct||contractOf(p);return ctValue(p,u,cur,p.wage,negYears(N,p),p.role)}
  return wageDemand(p,u,N.role,N.years);
}
function negEval(N,p,u){
  const ct=negCt(N,p,u),W=wk(N.mw),yrs=negYears(N,p),role=N.years===0?p.role:N.role;
  const val=ctValue(p,u,ct,W,yrs,role),dem=negDemand(N,p,u);return {ct,W,yrs,role,val,dem,ratio:val/Math.max(1,dem)};
}
function negInit(p,u,mode){
  const role=suggestRole(p,u),keep=mode==='extend'&&p.until>S.season,years=keep?0:p.age>=31?1:p.age<=23?4:3;
  const N={pid:p.id,mode,role:keep?p.role:role,years,mw:0,b:{},ri:0,ar:0,up:0,dn:0,rt:'none',rc:0,rw:'always',rf:'',ru:'',msg:null};
  const cur=mode==='extend'?(p.ct||contractOf(p)):{};
  const W0=mode==='extend'?p.wage:wageDemand(p,u,role,years||1);
  for(const b of BONUS){
    if(mode==='extend')N.b[b.k]=b.k==='si'?0:(cur[b.k]||0);
    else N.b[b.k]=(b.k==='ap'||b.k==='gl')&&bonusApplies(b,p,u)?bonusAmount(b,1,W0):0;
  }
  if(mode==='extend'){const ix=(arr,v)=>Math.max(0,arr.findIndex(x=>JSON.stringify(x)===JSON.stringify(v)));
    N.ri=cur.ri?Math.max(1,ix(RAISE.ri,cur.ri)):0;N.ar=cur.ar?Math.max(1,RAISE.ar.findIndex(x=>x&&x[0]===cur.ar[0])):0;N.up=cur.up?Math.max(1,ix(RAISE.up,cur.up)):0;N.dn=cur.dn?Math.max(1,ix(RAISE.dn,cur.dn)):0;
    if(cur.rc){N.rt=cur.rt||'all';N.rc=cur.rc;N.rf=cur.rf||'';N.ru=cur.ru||'';N.rw=cur.rf&&cur.ru?'range':cur.rf?'from':cur.ru?'until':'always'}}
  N.mw=Math.round(mon(W0)/100)*100;
  if(mode==='buy')negMatchDemand(N,p,u);
  return N;
}
// Wert ist linear im Gehalt (Prämien fest): zwei Stützstellen → passendes Monatsgehalt
function negMatchDemand(N,p,u){
  const m0=N.mw||1000,e1=negEval(N,p,u);N.mw=m0*2;const e2=negEval(N,p,u);
  const slope=(e2.val-e1.val)/m0,need=m0+(e1.dem-e1.val)/Math.max(slope,1e-9);
  N.mw=Math.max(100,Math.ceil(need/100)*100);
}
function parseMoney(str){
  let t=String(str||'').toLowerCase().replace(/€|eur|euro/g,'').replace(/\s+/g,'');if(!t)return 0;
  let mul=1;if(/(mio|mill|m)\.?$/.test(t)){mul=1e6;t=t.replace(/(mio|mill|m)\.?$/,'')}else if(/(tsd|k|t)\.?$/.test(t)){mul=1e3;t=t.replace(/(tsd|k|t)\.?$/,'')}
  if(mul>1){if(t.includes(',')||(t.match(/\./g)||[]).length>1)t=t.replace(/\./g,'').replace(',','.')}else{t=t.replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.')}
  const v=parseFloat(t);return isFinite(v)?Math.max(0,v*mul):NaN;
}

function negSubmit(){
  const N=UI.neg,p=S.players[N.pid],u=userClub(),buy=N.mode==='buy';
  const fail=m=>{N.msg=m;N.ok=false;render()};
  if((p.negTries||0)>=3)return fail('Der Berater hat die Gespräche für diese Saison abgebrochen.');
  const bf=buy?buyFee(p,u):{fee:0,clause:false};
  if(buy){
    if(!isWindow())return fail('Das Transferfenster ist geschlossen.');
    if(p.club===S.user)return fail('Spieler gehört schon dir.');
    if(u.players.length>=32)return fail('Dein Kader ist voll (max. 32).');
    if(p.club!==null&&!bf.clause&&club(p.club).players.length<=19)return fail(`${esc(club(p.club).name)} gibt keine Spieler mehr ab – Kader zu klein.`);
    if(p.club!==null&&club(p.club).rep-u.rep>22&&ovr(p)>=clubAvg(club(p.club))-2)return fail(`${esc(pname(p))} hat kein Interesse – ${esc(club(p.club).name)} ist ihm sportlich zu weit voraus.`);
  }
  const E=negEval(N,p,u),fee=bf.fee,hand=buy&&p.club===null?E.W*6:0,si=E.ct.si||0;
  if(buy&&u.tBudget<fee+hand+si)return fail(`Nicht genug Transferbudget (nötig: ${money(fee+hand+si)}).`);
  if(!buy&&si&&u.budget<si)return fail('Für die Unterschriftsprämie ist nicht genug Geld auf dem Konto.');
  const free=u.wBudget-(wageBill(u)-(buy?0:p.wage));if(E.W>free)return fail('Das Gehalt sprengt dein Gehaltsbudget.');
  if(N.years!==0){const sugg=suggestRole(p,u),gap=ROLE_ORDER.indexOf(N.role)-ROLE_ORDER.indexOf(sugg);
    if(gap>=2){p.negTries=(p.negTries||0)+1;return fail(`Als ${ROLES[N.role].label} will er nicht unterschreiben – er sieht sich mindestens als ${ROLES[ROLE_ORDER[ROLE_ORDER.indexOf(sugg)+1]].label}.`)}}

  if(!accept){p.negTries=(p.negTries||0)+1;p.mor=clamp(p.mor-2,15,100);
    return fail(E.ratio>=.92?`Knapp! Das Paket erreicht ${Math.round(E.ratio*100)} % seiner Vorstellung – etwas mehr Gehalt oder eine Prämie, die er sich wünscht, könnte reichen.`:`Abgelehnt – das Paket liegt bei nur ${Math.round(E.ratio*100)} % seiner Vorstellung (entspricht ca. ${money(mon(E.dem))} brutto/Monat).`)}

    doTransfer(p,u,fee,{wage:E.W,until,role:N.role,ct:E.ct});
    if(si){payBonus(si,'si');u.tBudget=Math.max(0,u.tBudget-si)}
    addNews('transfer',`Neuzugang: ${fullname(p)}`,`Von ${esc(fromName)} für ${fee?money(fee):'ablösefrei'}${bf.clause?' (Ausstiegsklausel)':''} · ${money(N.mw)} brutto/Monat bis ${contractEnd(p)} · ${ROLES[N.role].label}${si?` · Unterschriftsprämie ${money(si)}`:''}.`);
  }else{
    const pd=p.ct?p.ct.pd||0:0;
    if(N.years!==0){p.until=S.season+N.years;p.role=N.role}
    p.wage=E.W;p.ct=Object.assign({},E.ct,{n:0,pd});p.negTries=0;p.mor=clamp(p.mor+(E.ratio>1.05?10:6),15,100);p.unhappy=false;
    if(si)payBonus(si,'si');
    addNews('transfer',`${fullname(p)}: ${N.years===0?'Vertrag angepasst':'verlängert'}`,`Vertrag bis ${contractEnd(p)} · ${money(N.mw)} brutto/Monat · ${ROLES[p.role].label}${si?` · Unterschriftsprämie ${money(si)}`:''}.`);
  }
  UI.modal=null;UI.neg=null;S.rng=RNG;save();toast(buy?`${fullname(p)} unterschreibt!`:'Vertrag unterschrieben!');
}

  <textarea id="impTxt" style="width:100%;height:130px;margin-top:10px;font-size:11px" placeholder="Spielstand-Text hier einfügen…"></textarea>
  <div class="row" style="margin-top:10px"><button class="btn pri" data-act="doImport">Importieren</button><button class="btn" data-act="closeModal">Abbrechen</button></div>`}

/* ---------- Live-Spiel & Ergebnisse ---------- */
function renderLive(){
  const L=UI.live;if(!L)return renderHome();
  const {m,r}=L,hc=club(m.h),ac=club(m.a);
  const shown=r.ev.filter(e=>e.m<=L.min);let hg=0,ag=0,ph=0,pa=0;shown.forEach(e=>{if(e.type==='goal')e.side==='h'?hg++:ag++;if(e.type==='pen')e.side==='h'?ph++:pa++});
  const inPen=shown.some(e=>e.type==='pen'||e.type==='penmiss'||(e.type==='info'&&e.m===121));
  const evHtml=shown.slice().reverse().map(e=>{const c=e.side==='h'?hc:ac;const ic=e.type==='goal'?'⚽':e.type==='card'?'🟨':e.type==='injury'?'🩹':e.type==='pen'?'✅':e.type==='penmiss'?'❌':e.type==='info'?'📣':'•';
    const mm=e.m>120?'i.E.':e.m+"'";return `<div class="ev ${e.type==='goal'||e.type==='info'?'goal':''}"><span class="m">${mm}</span><span>${ic} ${e.type==='info'?'':'<b>'+esc(c.short)+'</b> '}${esc(e.t)}${e.type==='goal'?' <span class="muted">('+e.score+')</span>':''}${e.type==='pen'||e.type==='penmiss'?' <span class="muted">('+e.score+')</span>':''}</span></div>`}).join('');
  const minLbl=L.done?(m.pen?'nach Elfmeterschießen':m.et?'nach Verlängerung':'Abpfiff'):L.min>120?'Elfmeterschießen':L.min>90&&r.et?'Verlängerung · '+L.min+'. Minute':Math.min(L.min,90)+'. Minute';
  const barMax=r.et?120:90;
  const sp=s=>`<button class="${L.speed===s?'on':''}" data-act="speed" data-v="${s}">${s===400?'Langsam':s===150?'Normal':'Schnell'}</button>`;
  return `<div class="card"><div class="small muted" style="text-align:center;margin-bottom:6px">${L.label?esc(L.label):esc(L.L.name)+' · '+(L.round+1)+'. Spieltag'}</div><div class="score"><div>${badge(hc,48)}<div style="margin-top:6px"><b>${esc(hc.name)}</b></div><div class="small muted">${hc.tactic.f} · ${MENTALITY[hc.tactic.men]}</div></div>
   <div><div class="big">${hg}:${ag}</div>${inPen?`<div class="small"><b>i.E. ${ph}:${pa}</b></div>`:''}<div class="pill">${minLbl}</div></div>
   <div>${badge(ac,48)}<div style="margin-top:6px"><b>${esc(ac.name)}</b></div><div class="small muted">${ac.tactic.f} · ${MENTALITY[ac.tactic.men]}</div></div></div>
   <div class="bar" style="margin-top:14px"><i style="width:${Math.min(L.min,barMax)/barMax*100}%"></i></div>
   ${L.done?`<div class="row small muted" style="justify-content:center;margin-top:10px;gap:18px"><span>Ballbesitz ${r.poss}% : ${100-r.poss}%</span><span>Torschüsse ${r.sh} : ${r.sa}</span></div>`:''}
   <div class="row" style="justify-content:center;margin-top:12px">${L.done?`<button class="btn pri" data-act="liveDone">${UI.liveQueue&&UI.liveQueue.length?'Nächstes Spiel ▶':'Weiter zu den Ergebnissen ▶'}</button>`:`<div class="seg">${sp(400)}${sp(150)}${sp(40)}</div><button class="btn" data-act="liveSkip">Zum Ergebnis ⏭</button>`}</div></div>
   <div class="card tick" style="margin-top:12px">${evHtml||'<p class="muted">Anpfiff…</p>'}</div>`;
}
function startLive(res){UI.live={m:res.m,r:res.r,round:res.round,L:res.L,label:res.label||null,min:0,speed:(UI.live&&UI.live.speed)||150,done:false};UI.view='live';render();tickLive()}
function tickLive(){clearTimeout(tickLive.t);const L=UI.live;if(!L||L.done)return;const end=L.r.end||95;L.min++;if(L.min>=end){L.min=end;L.done=true}if(UI.view==='live')render();if(!L.done)tickLive.t=setTimeout(tickLive,L.min>120?Math.max(L.speed,350):L.speed)}
function renderWeekResults(){
  const W=UI.weekRes||{played:[]};const uL=league(userClub());
  const mine=W.played.find(x=>x.L.id===uL.id);
  let main;
  if(mine){const rows=mine.L.fixtures[mine.r].map(m=>`<tr class="${m.h===S.user||m.a===S.user?'me':''}"><td style="text-align:right">${esc(club(m.h).name)} ${badge(club(m.h),20)}</td><td style="text-align:center"><b>${m.hg}:${m.ag}</b></td><td>${badge(club(m.a),20)} ${esc(club(m.a).name)}</td></tr>`).join('');
    main=`<h3>${esc(uL.name)} · ${mine.r+1}. Spieltag</h3><div class="tw"><table><tbody>${rows}</tbody></table></div>`}
  else main=`<div class="card"><b>Deine Liga hatte diese Woche spielfrei.</b><p class="small muted">Andere Ligen haben gespielt: ${W.played.map(x=>esc(x.L.name)).join(', ')||'keine'}.</p></div>`;
  const cupRes=(S.comps||[]).filter(C=>!C.bg).map(C=>{const rs=C.rounds.filter(r=>r.w===S.week-1&&r.done);if(!rs.length)return '';
    const mine=C.teams.includes(S.user);
    return rs.map(r=>`<h3 style="margin-top:14px">${COMP[C.key].name} · ${esc(r.label)}</h3><div class="tw"><table><tbody>${r.matches.filter(m=>mine||C.key===UI.cup||true).slice(0,mine?99:8).map(m=>`<tr class="${m.h===S.user||m.a===S.user?'me':''}"><td style="text-align:right">${esc(club(m.h).name)} ${badge(club(m.h),20)}</td><td style="text-align:center"><b>${resultText(m)}</b></td><td>${badge(club(m.a),20)} ${esc(club(m.a).name)}</td></tr>`).join('')}</tbody></table></div>`).join('')}).join('');
  const nc=userNatCup();let natRes='';
  const row=m=>`<tr class="${m.h===S.user||m.a===S.user?'me':''}"><td style="text-align:right">${m.win===m.h?'<b>':''}${esc(club(m.h).name)}${m.win===m.h?'</b>':''} <span class="small muted">${tierLabel(club(m.h))}</span> ${badge(club(m.h),20)}</td><td style="text-align:center"><b>${resultText(m)}</b></td><td>${badge(club(m.a),20)} <span class="small muted">${tierLabel(club(m.a))}</span> ${m.win===m.a?'<b>':''}${esc(club(m.a).name)}${m.win===m.a?'</b>':''}</td></tr>`;
  if(nc){const r=nc.rounds.find(r=>r.w===S.week-1&&r.done);if(r){const ms=r.matches.slice().sort((a,b)=>((b.h===S.user||b.a===S.user)-(a.h===S.user||a.a===S.user)));natRes=`<h3 style="margin-top:14px">${esc(nc.name)} · ${esc(r.label)}</h3><div class="tw"><table><tbody>${ms.slice(0,16).map(row).join('')}</tbody></table></div>`}}
  for(const sc of S.supercups||[]){if(sc.code!==userClub().assoc)continue;for(const r of sc.rounds)if(r.w===S.week-1&&r.done)natRes=`<h3 style="margin-top:14px">${esc(sc.name)} · ${esc(r.label)}</h3><div class="tw"><table><tbody>${r.matches.map(row).join('')}</tbody></table></div>`+natRes}
  return `<div class="row" style="justify-content:space-between"><h2>Woche ${S.week} – Ergebnisse</h2><button class="btn pri" data-act="nav" data-v="home">Zur Übersicht</button></div>
  <div class="grid g2"><div>${main}${cupRes}${natRes}</div><div>${tableHtml(uL,true)}</div></div>`;
}
function renderSeasonEndScreen(){
  const u=userClub(),L=league(u),tab=tableOf(L),champ=club(tab[0].id),rank=tab.findIndex(r=>r.id===S.user)+1;
  const n=tab.length,promo=L.up&&rank<=L.up,rel=L.down&&rank>n-L.down;
  return `<div class="card" style="text-align:center"><div style="font-size:44px">🏆</div><h2>${esc(champ.name)} ist Meister der ${esc(L.name)} ${S.season}/${(S.season+1)%100}!</h2>
   <p>Dein ${esc(u.name)} beendet die Saison auf <b>Platz ${rank}</b>. Ziel war: ${u.target.t} ${rank<=u.target.r?'<span class="good">✓ erreicht</span>':'<span class="bad">✗ verfehlt</span>'}</p>
   ${promo?'<p class="good"><b>🎉 Aufstieg geschafft!</b></p>':''}${rel?'<p class="bad"><b>Abstieg 😞</b></p>':''}
   ${userSupercup()?`<p>🛡️ ${esc(userSupercup().name)}: <b>${userSupercup().winner===S.user?'🏆 gewonnen':'verloren'}</b></p>`:''}
   ${userNatCup()?`<p>🏆 ${esc(userNatCup().name)}: <b>${natCupStatus(userNatCup(),S.user)}</b></p>`:''}
   ${userComps().map(C=>`<p>🏅 ${COMP[C.key].name}: <b>${compStatus(C,S.user)}</b></p>`).join('')}
   <p class="small muted">Beim Saisonwechsel steigen Vereine auf und ab, Spieler altern und entwickeln sich, Verträge laufen aus, jede Akademie bringt Jugendspieler, und in den Hintergrund-Ländern werden die Meister ermittelt.</p>
   <button class="btn pri" data-act="newSeason">Neue Saison starten ▶</button></div><div style="margin-top:14px">${tableHtml(L,false)}</div>`;
}

function negDateFix(N){const p=S.players[N.pid],endY=N.years===0?p.until:S.season+N.years,cEnd=`${endY+1}-06-30`,t=gameDate();
  for(const k of ['rf','ru'])if(N[k]){if(N[k]>cEnd)N[k]=cEnd;if(N[k]<t)N[k]=t}
  if(N.rw==='range'&&N.rf&&N.ru&&N.ru<=N.rf)N.ru=addDaysIso(N.rf,60)>cEnd?cEnd:addDaysIso(N.rf,60)}

  tfYoung:el=>{UI.tf.young=el.checked;render()},
  tfExp:el=>{UI.tf.exp=el.checked;render()},
  impFile:el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.getElementById('impTxt').value=r.result};r.readAsText(f)},
};
document.addEventListener('click',e=>{
  if(e.target.closest('input[type=checkbox]'))return;
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='closeModal'&&e.target.closest('[data-stop]')&&!e.target.closest('button'))return;
  e.preventDefault();ACT[el.dataset.act]&&ACT[el.dataset.act](el.dataset,el);
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&CHG[el.dataset.chg])CHG[el.dataset.chg](el)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.modal){UI.modal=null;render()}});

/* Start */
(function init(){UI.meta=readMeta();UI.oldSave=hasOldSave();render()})();

</script>
</body>
</html>
